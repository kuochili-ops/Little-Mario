  <style>

  <script type="importmap">
    {

<body>
  <div id="canvas-container"></div>
  <div class="status-banner" id="statusBanner">🔊 點擊畫面或機台按鍵，啟動《Hawaii Five-O》音樂與音效！</div>

  <div class="control-panel" id="controlPanel">
    <div class="panel-header" id="panelHeader">
      <span class="panel-title">𓃥 小瑪莉遊戲機 3D</span>
      <button class="toggle-btn" id="toggleBtn">▾</button>
    </div>
    <div class="panel-body">
      <div class="control-group">
        <span class="control-label">機殼外觀塗裝</span>
        <div class="btn-row">
          <button class="style-btn active" data-theme="white">珍珠白</button>
          <button class="style-btn" data-theme="darkwood">胡桃木</button>
          <button class="style-btn" data-theme="lightwood">白橡木</button>
        </div>
      </div>

      <div class="control-group">
        <span class="control-label">音樂與音效 (Hawaii Five-O)</span>
        <div class="btn-row-2">
          <button class="action-btn btn-active-green" id="toggleBgmBtn">🎵 BGM：開啟</button>
          <button class="action-btn btn-active-green" id="toggleSfxBtn">🔊 音效：開啟</button>
        </div>
      </div>

      <div class="control-group">
        <span class="control-label">快捷控制與視角</span>
        <button class="action-btn btn-secondary" id="insertCoinBtn">🪙 投幣 (+10 分)</button>
        <div class="btn-row-2">
          <button class="action-btn btn-secondary" id="focusKeysBtn">🕹️ 特寫按鍵</button>
          <button class="action-btn btn-secondary" id="resetCamBtn">🎯 全機視角</button>
        </div>
      </div>

      <div class="control-group">
        <span class="control-label">模型輸出</span>
        <button class="action-btn btn-primary" id="exportGlbBtn">📦 匯出 GLB 檔案</button>
      </div>

      <div class="hint-text">
        • <b>下排 8 鍵</b>：BAR / 77 / 雙星 / 西瓜 / 雙鈴 / 檸檬 / 橘子 / 蘋果<br>
        • <b>上排左 3 鍵</b>：得分移分、比倍小(1-6)、比倍大(8-13)<br>
        • <b>上排右 3 鍵</b>：全押/續押、清除、啟動 + 退幣圓鈕
      </div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
    import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

    // =========================================================================
    // 0. 混合低延遲音訊引擎：HTML5 <audio> 播 BGM + 輕量 WebAudio 播快速跑燈音效
    // =========================================================================
    class HybridArcadeAudio {
      constructor() {
        this.sampleRate = 22050;
        this.bgmEnabled = true;
        this.sfxEnabled = true;
        this.bgmAudio = null;
        this.bgmStarted = false;
        this.sfxPools = {};
        this.poolCursor = {};
        this.webCtx = null;

        this._buildAllWavAssets();
      }

      _initWebAudio() {
        if (!this.webCtx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.webCtx = new AudioCtx();
        }
        if (this.webCtx && this.webCtx.state === 'suspended') {
          this.webCtx.resume();
        }
      }

      // 專為高頻跑燈步進設計的零阻塞脈衝音
      playFastStepBeep(stepIndex) {
        if (!this.sfxEnabled) return;
        this._initWebAudio();
        if (!this.webCtx) return;
        try {
          const now = this.webCtx.currentTime;
          const osc = this.webCtx.createOscillator();
          const gain = this.webCtx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(760 + (stepIndex % 4) * 75, now);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.032);
          osc.connect(gain);
          gain.connect(this.webCtx.destination);
          osc.start(now);
          osc.stop(now + 0.036);
        } catch (e) {}
      }

      _encodeWav(samples) {
        const numSamples = samples.length;
        const buffer = new ArrayBuffer(44 + numSamples * 2);
        const view = new DataView(buffer);
        const writeStr = (offset, str) => {
          for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
        };

        writeStr(0, 'RIFF');
        view.setUint32(4, 36 + numSamples * 2, true);
        writeStr(8, 'WAVE');
        writeStr(12, 'fmt ');
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, 1, true);
        view.setUint32(24, this.sampleRate, true);
        view.setUint32(28, this.sampleRate * 2, true);
        view.setUint16(32, 2, true);
        view.setUint16(34, 16, true);
        writeStr(36, 'data');
        view.setUint32(40, numSamples * 2, true);

        let offset = 44;
        for (let i = 0; i < numSamples; i++) {
          let s = Math.max(-1, Math.min(1, samples[i]));
          view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
          offset += 2;
        }
        return URL.createObjectURL(new Blob([buffer], { type: 'audio/wav' }));
      }

      _mixNote(buffer, startSec, durSec, freq, waveType = 'square', vol = 0.25, endFreq = null) {
        const startIdx = Math.floor(startSec * this.sampleRate);
        const len = Math.floor(durSec * this.sampleRate);
        for (let i = 0; i < len; i++) {
          const idx = startIdx + i;
          if (idx >= buffer.length) break;
          const t = i / this.sampleRate;
          const progress = i / len;
          const curFreq = endFreq ? freq * Math.pow(endFreq / freq, progress) : freq;
          const phase = (t * curFreq) % 1;

          let sample = 0;
          if (waveType === 'square') sample = phase < 0.5 ? 1 : -1;
          else if (waveType === 'triangle') sample = 1 - 4 * Math.abs(Math.round(phase - 0.25) - (phase - 0.25));
          else if (waveType === 'sawtooth') sample = 2 * phase - 1;
          else if (waveType === 'noise') sample = Math.random() * 2 - 1;
          else sample = Math.sin(2 * Math.PI * t * curFreq);

          const attack = Math.min(1, i / (this.sampleRate * 0.008));
          const release = Math.pow(1 - progress, 1.4);
          buffer[idx] += sample * vol * attack * release;
        }
      }

      _createToneWav(notes) {
        let totalDur = 0;
        notes.forEach(n => { totalDur = Math.max(totalDur, (n.delay || 0) + n.dur + 0.03); });
        const samples = new Float32Array(Math.ceil(totalDur * this.sampleRate));
        notes.forEach(n => {
          this._mixNote(samples, n.delay || 0, n.dur, n.freq, n.type || 'square', n.vol || 0.28, n.endFreq || null);
        });
        return this._encodeWav(samples);
      }

      _buildHawaiiFiveOWav() {
        const stepSec = 0.135;
        const melody = [
          { f: 523.25, d: 2 }, null, { f: 659.25, d: 1 }, { f: 783.99, d: 2 }, null, { f: 659.25, d: 1 }, { f: 523.25, d: 2 }, null,
          { f: 587.33, d: 2 }, null, { f: 698.46, d: 1 }, { f: 880.00, d: 2 }, null, { f: 698.46, d: 1 }, { f: 587.33, d: 2 }, null,
          { f: 523.25, d: 1.5 }, null, { f: 523.25, d: 1 }, { f: 659.25, d: 1 }, { f: 783.99, d: 2.5 }, null, null, { f: 659.25, d: 1 },
          { f: 880.00, d: 2 }, null, { f: 783.99, d: 1.5 }, null, { f: 659.25, d: 1.5 }, null, { f: 587.33, d: 2 }, null,
          { f: 523.25, d: 1.5 }, null, { f: 523.25, d: 1 }, { f: 659.25, d: 1 }, { f: 783.99, d: 2.5 }, null, null, { f: 783.99, d: 1 },
          { f: 1046.50, d: 2.5 }, null, null, { f: 880.00, d: 1 }, { f: 783.99, d: 1.5 }, null, { f: 659.25, d: 2 }, null,
          { f: 698.46, d: 1.5 }, null, { f: 880.00, d: 1.5 }, null, { f: 1046.50, d: 2 }, null, { f: 880.00, d: 1 }, { f: 783.99, d: 1 },
          { f: 659.25, d: 1.5 }, null, { f: 587.33, d: 1.5 }, null, { f: 523.25, d: 3 }, null, null, null
        ];

        const bassline = [
          130.81, 0, 130.81, 196.00, 130.81, 0, 164.81, 196.00,
          146.83, 0, 146.83, 220.00, 146.83, 0, 174.61, 220.00,
          130.81, 0, 130.81, 196.00, 130.81, 0, 164.81, 196.00,
          174.61, 0, 174.61, 220.00, 196.00, 0, 196.00, 246.94,
          130.81, 0, 130.81, 196.00, 130.81, 0, 164.81, 196.00,
          220.00, 0, 220.00, 261.63, 196.00, 0, 164.81, 196.00,
          174.61, 0, 174.61, 220.00, 174.61, 0, 196.00, 220.00,
          196.00, 0, 196.00, 146.83, 130.81, 0, 196.00, 130.81
        ];

        const totalSec = melody.length * stepSec;
        const samples = new Float32Array(Math.ceil(totalSec * this.sampleRate));

        for (let i = 0; i < melody.length; i++) {
          const t = i * stepSec;
          const note = melody[i];
          if (note) {
            this._mixNote(samples, t, note.d * stepSec * 0.94, note.f, 'square', 0.14);
            this._mixNote(samples, t, note.d * stepSec * 0.94, note.f * 0.5, 'sawtooth', 0.08);
          }
          const bass = bassline[i];
          if (bass > 0) {
            this._mixNote(samples, t, stepSec * 0.92, bass, 'triangle', 0.22);
          }
          if (i % 4 === 0) this._mixNote(samples, t, 0.08, 110, 'sine', 0.18, 45);
          else if (i % 4 === 2) this._mixNote(samples, t, 0.055, 800, 'noise', 0.09);
        }

        return this._encodeWav(samples);
      }

      _buildAllWavAssets() {
        const bgmUrl = this._buildHawaiiFiveOWav();
        this.bgmAudio = new Audio(bgmUrl);
        this.bgmAudio.loop = true;
        this.bgmAudio.volume = 0.52;
        this.bgmAudio.preload = 'auto';

        const registerSfx = (key, notes, poolSize = 2) => {
          const url = this._createToneWav(notes);
          this.sfxPools[key] = [];
          this.poolCursor[key] = 0;
          for (let i = 0; i < poolSize; i++) {
            const a = new Audio(url);
            a.preload = 'auto';
            a.volume = 0.85;
            this.sfxPools[key].push(a);
          }
        };

        registerSfx('coin', [
          { freq: 987.77, dur: 0.08, delay: 0, vol: 0.35 },
          { freq: 1318.51, dur: 0.32, delay: 0.07, vol: 0.35 }
        ], 2);

        const betScale = [523.25, 587.33, 659.25, 698.46, 783.99, 880.00, 987.77, 1046.50];
        betScale.forEach((f, idx) => {
          registerSfx(`bet_${idx}`, [{ freq: f, dur: 0.075, vol: 0.32 }], 2);
        });

        registerSfx('button', [
          { freq: 440, dur: 0.05, type: 'triangle', vol: 0.35 },
          { freq: 660, dur: 0.07, delay: 0.03, type: 'triangle', vol: 0.32 }
        ], 2);

        registerSfx('win_small', [523.25, 659.25, 783.99, 1046.50].map((f, i) => ({
          freq: f, dur: 0.14, delay: i * 0.085, vol: 0.34
        })), 1);

        registerSfx('win_big', [523.25, 659.25, 783.99, 1046.50, 783.99, 1046.50, 1318.51, 1567.98].map((f, i, arr) => ({
          freq: f, dur: i === arr.length - 1 ? 0.38 : 0.11, delay: i * 0.09, vol: 0.36
        })), 1);

        registerSfx('once_more', [587.33, 739.99, 880.00, 1174.66, 880.00, 1174.66].map((f, i) => ({
          freq: f, dur: 0.09, delay: i * 0.065, type: 'triangle', vol: 0.35
        })), 1);

        registerSfx('lose', [
          { freq: 311.13, dur: 0.16, type: 'sawtooth', vol: 0.28 },
          { freq: 220.00, dur: 0.28, delay: 0.14, type: 'sawtooth', vol: 0.28 }
        ], 1);

        registerSfx('take_score', [0, 1, 2, 3, 4, 5].map(i => ({
          freq: 880 + i * 95, dur: 0.055, delay: i * 0.045, vol: 0.30
        })), 1);

        registerSfx('payout_coin', [
          { freq: 1850, endFreq: 1320, dur: 0.05, type: 'sine', vol: 0.32 },
          { freq: 2637, dur: 0.07, delay: 0.025, type: 'triangle', vol: 0.24 }
        ], 3);
      }

      _playPool(key) {
        if (!this.sfxEnabled) return;
        const pool = this.sfxPools[key];
        if (!pool) return;
        const idx = this.poolCursor[key] % pool.length;
        this.poolCursor[key]++;
        const audioEl = pool[idx];
        try {
          audioEl.currentTime = 0;
          const p = audioEl.play();
          if (p && p.catch) p.catch(() => {});
        } catch (e) {}
      }

      unlockAndStartBgm() {
        this._initWebAudio();
        if (this.bgmEnabled && this.bgmAudio && this.bgmAudio.paused) {
          const p = this.bgmAudio.play();
          if (p && p.then) {
            p.then(() => { this.bgmStarted = true; }).catch(() => {});
          }
        }
      }

      playCoin() { this.unlockAndStartBgm(); this._playPool('coin'); }
      playBet(index) { this.unlockAndStartBgm(); this._playPool(`bet_${index}`); }
      playButton() { this.unlockAndStartBgm(); this._playPool('button'); }
      playStep(stepIndex) { this.playFastStepBeep(stepIndex); }
      playWin(isBigWin = false) { this.unlockAndStartBgm(); this._playPool(isBigWin ? 'win_big' : 'win_small'); }
      playOnceMore() { this.unlockAndStartBgm(); this._playPool('once_more'); }
      playLose() { this.unlockAndStartBgm(); this._playPool('lose'); }
      playTakeScore() { this.unlockAndStartBgm(); this._playPool('take_score'); }
      playPayoutCoin() { this._playPool('payout_coin'); }

      setBgmEnabled(enabled) {
        this.bgmEnabled = enabled;
        if (!this.bgmAudio) return;
        if (enabled) this.unlockAndStartBgm();
        else this.bgmAudio.pause();
      }
    }

    const audio = new HybridArcadeAudio();

    const autoUnlockAudio = () => {
      audio.unlockAndStartBgm();
      if (audio.bgmStarted) {
        window.removeEventListener('pointerdown', autoUnlockAudio);
        window.removeEventListener('touchstart', autoUnlockAudio);
        window.removeEventListener('click', autoUnlockAudio);
      }
    };
    window.addEventListener('pointerdown', autoUnlockAudio, { passive: true });
    window.addEventListener('touchstart', autoUnlockAudio, { passive: true });
    window.addEventListener('click', autoUnlockAudio, { passive: true });

    // =========================================================================
    // 1. 場景與渲染器設置
    // =========================================================================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x161922);

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0.35, 2.55, 5.1);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.target.set(0, 1.48, 0.15);
    controls.minDistance = 1.8;
    controls.maxDistance = 11;

    scene.add(new THREE.AmbientLight(0xffffff, 0.85));

    const keyLight = new THREE.DirectionalLight(0xfff8eb, 1.8);
    keyLight.position.set(4, 7, 5);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.width = 1024;
    keyLight.shadow.mapSize.height = 1024;
    keyLight.shadow.camera.near = 1;
    keyLight.shadow.camera.far = 20;
    keyLight.shadow.bias = -0.0005;
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xdbeafe, 0.75);
    fillLight.position.set(-5, 3, 4);
    scene.add(fillLight);

    const backLight = new THREE.DirectionalLight(0xffffff, 0.5);
    backLight.position.set(0, 5, -5);
    scene.add(backLight);

    const floor = new THREE.Mesh(
      new THREE.CircleGeometry(6, 64),
      new THREE.MeshStandardMaterial({ color: 0x1e222d, roughness: 0.85, metalness: 0.1 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const gridHelper = new THREE.GridHelper(10, 20, 0x2d3343, 0x222734);
    gridHelper.position.y = 0.002;
    scene.add(gridHelper);

    // =========================================================================
    // 2. 遊戲狀態與離屏快取高流暢度螢幕貼圖引擎
    // =========================================================================
    const betChannels = [
      { id: 'bar',    icon: 'BAR',  odds: 100, color: '#fbbf24', bg: '#1e293b' },
      { id: '77',     icon: '77',   odds: 40,  color: '#ef4444', bg: '#fee2e2' },
      { id: 'star',   icon: '⭐⭐', odds: 30,  color: '#eab308', bg: '#fef9c3' },
      { id: 'melon',  icon: '🍉',   odds: 20,  color: '#16a34a', bg: '#dcfce7' },

    // 使用最佳化尺寸 (768x870) + 離屏靜態背景快取，大幅減少手機 GPU 負擔
    const SCREEN_W = 768;

    function getCellCoords(index, startX, startY, cellW, cellH) {
      if (index < 7) return { x: startX + index * cellW, y: startY };
      if (index < 12) return { x: startX + 6 * cellW, y: startY + (index - 6) * cellH };
      if (index < 19) return { x: startX + (18 - index) * cellW, y: startY + 6 * cellH };
      return { x: startX, y: startY + (24 - index) * cellH };
    }

    const BOARD_X = 27;
    const BOARD_Y = 106;
    const BOARD_W = SCREEN_W - 54;
    const BOARD_H = 578;
    const CELL_W = BOARD_W / 7;
    const CELL_H = BOARD_H / 7;

    function drawSingleCell(targetCtx, i, isLit) {
      const cell = boardCells[i];
      const { x, y } = getCellCoords(i, BOARD_X, BOARD_Y, CELL_W, CELL_H);

      targetCtx.fillStyle = isLit ? '#fef08a' : cell.bg;
      targetCtx.fillRect(x + 2, y + 2, CELL_W - 4, CELL_H - 4);

      targetCtx.lineWidth = isLit ? 7 : 2.5;
      targetCtx.strokeStyle = isLit ? '#ff1e1e' : '#78350f';
      targetCtx.strokeRect(x + 3, y + 3, CELL_W - 6, CELL_H - 6);

      if (isLit) {
        targetCtx.fillStyle = 'rgba(255, 35, 35, 0.28)';
        targetCtx.fillRect(x + 3, y + 3, CELL_W - 6, CELL_H - 6);
      }

      targetCtx.textAlign = 'center';
      targetCtx.textBaseline = 'middle';
      if (cell.label.includes('\n')) {
        const lines = cell.label.split('\n');
        targetCtx.fillStyle = cell.color || '#7f1d1d';
        targetCtx.font = '900 16px sans-serif';
        targetCtx.fillText(lines[0], x + CELL_W / 2, y + CELL_H * 0.38);
        targetCtx.fillText(lines[1], x + CELL_W / 2, y + CELL_H * 0.65);
      } else if (cell.label === 'BAR' || cell.label === '77') {
        targetCtx.fillStyle = cell.color || '#ffffff';
        targetCtx.font = '900 27px sans-serif';
        targetCtx.fillText(cell.label, x + CELL_W / 2, y + CELL_H * (cell.tag ? 0.62 : 0.52));
      } else {
        targetCtx.font = '39px sans-serif';
        targetCtx.fillText(cell.label, x + CELL_W / 2, y + CELL_H * (cell.tag ? 0.45 : 0.52));
      }

      if (cell.tag) {
        targetCtx.fillStyle = '#dc2626';
        targetCtx.font = 'bold 14px sans-serif';
        const tagY = (cell.label === 'BAR') ? y + CELL_H * 0.22 : y + CELL_H * 0.82;
        targetCtx.fillText(cell.tag, x + CELL_W / 2, tagY);
      }
    }

    // 預先繪製靜態背景層（只執行一次）
    function buildStaticBoardCache() {
      const W = SCREEN_W;
      const H = SCREEN_H;

      sCtx.fillStyle = '#3b1d14';
      sCtx.fillRect(0, 0, W, H);

      sCtx.fillStyle = '#5c2c16';
      sCtx.fillRect(18, 14, W - 36, 80);
      sCtx.strokeStyle = '#d97706';
      sCtx.lineWidth = 3;
      sCtx.strokeRect(18, 14, W - 36, 80);

      // WINNER 與 CREDIT 外框
      sCtx.fillStyle = '#7f1d1d';
      sCtx.beginPath();
      sCtx.roundRect(105, 24, 225, 60, 10);
      sCtx.fill();
      sCtx.strokeStyle = '#fbbf24';
      sCtx.stroke();

      sCtx.fillStyle = '#fde047';
      sCtx.font = 'bold 15px sans-serif';
      sCtx.textAlign = 'center';
      sCtx.fillText('WINNER (得分)', 217, 40);

      sCtx.fillStyle = '#7f1d1d';
      sCtx.beginPath();
      sCtx.roundRect(420, 24, 225, 60, 10);
      sCtx.fill();
      sCtx.strokeStyle = '#fbbf24';
      sCtx.stroke();

      sCtx.fillStyle = '#fde047';
      sCtx.fillText('CREDIT (可用分數)', 532, 40);

      // 中央插畫區
      const innerX = BOARD_X + CELL_W;
      const innerY = BOARD_Y + CELL_H;
      const innerW = CELL_W * 5;
      const innerH = CELL_H * 5;

      const skyGrad = sCtx.createLinearGradient(0, innerY, 0, innerY + innerH);
      skyGrad.addColorStop(0, '#1d4ed8');
      skyGrad.addColorStop(0.65, '#3b82f6');
      skyGrad.addColorStop(0.66, '#65a30d');
      skyGrad.addColorStop(1, '#3f6212');
      sCtx.fillStyle = skyGrad;
      sCtx.fillRect(innerX, innerY, innerW, innerH);

      sCtx.fillStyle = '#fef08a';
      [[innerX + 60, innerY + 98], [innerX + 195, innerY + 52], [innerX + 435, innerY + 82], [innerX + 90, innerY + 195]].forEach(([sx, sy]) => {
        sCtx.beginPath();
        sCtx.arc(sx, sy, 3, 0, Math.PI * 2);
        sCtx.fill();
      });

      // 「小瑪莉」招牌字
      sCtx.save();
      sCtx.fillStyle = '#991b1b';
      sCtx.fillRect(innerX + 18, innerY + 18, 176, 57);
      sCtx.strokeStyle = '#fbbf24';
      sCtx.lineWidth = 3;
      sCtx.strokeRect(innerX + 18, innerY + 18, 176, 57);

      sCtx.font = '900 40px "Noto Sans TC", "Microsoft JhengHei", sans-serif';
      sCtx.textAlign = 'center';
      sCtx.lineWidth = 6;
      sCtx.strokeStyle = '#ffffff';
      sCtx.strokeText('小瑪莉', innerX + 106, innerY + 61);
      sCtx.fillStyle = '#ef4444';
      sCtx.fillText('小瑪莉', innerX + 106, innerY + 61);
      sCtx.restore();

      // 左側小烏龜角色
      sCtx.fillStyle = '#facc15';
      sCtx.beginPath();
      sCtx.ellipse(innerX + 124, innerY + 285, 32, 41, 0, 0, Math.PI * 2);
      sCtx.fill();
      sCtx.beginPath();
      sCtx.arc(innerX + 116, innerY + 232, 24, 0, Math.PI * 2);
      sCtx.fill();
      sCtx.fillStyle = '#16a34a';
      sCtx.beginPath();
      sCtx.ellipse(innerX + 142, innerY + 281, 19, 34, 0.2, 0, Math.PI * 2);
      sCtx.fill();

      // 右側紅帽角色
      sCtx.fillStyle = '#2563eb';
      sCtx.beginPath();
      sCtx.ellipse(innerX + 371, innerY + 221, 44, 54, 0, 0, Math.PI * 2);
      sCtx.fill();
      sCtx.fillStyle = '#fed7aa';
      sCtx.beginPath();
      sCtx.arc(innerX + 356, innerY + 139, 34, 0, Math.PI * 2);
      sCtx.fill();
      sCtx.fillStyle = '#dc2626';
      sCtx.beginPath();
      sCtx.arc(innerX + 360, innerY + 124, 35, Math.PI, 0);
      sCtx.fill();
      sCtx.fillRect(innerX + 319, innerY + 118, 52, 11);
      sCtx.fillStyle = '#15803d';
      sCtx.beginPath();
      sCtx.ellipse(innerX + 371, innerY + 311, 46, 25, 0, Math.PI, 0);
      sCtx.fill();
      sCtx.fillStyle = '#fef08a';
      sCtx.fillRect(innerX + 325, innerY + 311, 93, 11);

      // 靜態 24 格未點亮狀態
      for (let i = 0; i < 24; i++) {
        drawSingleCell(sCtx, i, false);
      }

      // 底部 8 格圖示與倍率標頭
      const betY = 698;
      const betW = BOARD_W / 8;
      betChannels.forEach((item, idx) => {
        const bx = BOARD_X + idx * betW;
        sCtx.fillStyle = item.bg;
        sCtx.fillRect(bx + 3, betY, betW - 6, 64);
        sCtx.strokeStyle = '#fbbf24';
        sCtx.lineWidth = 2.5;
        sCtx.strokeRect(bx + 3, betY, betW - 6, 64);

        sCtx.fillStyle = item.color;
        sCtx.font = item.icon.length > 2 ? 'bold 21px sans-serif' : '30px sans-serif';
        sCtx.textAlign = 'center';
        sCtx.textBaseline = 'middle';
        sCtx.fillText(item.icon, bx + betW / 2, betY + 25);

        sCtx.fillStyle = item.id === 'bar' ? '#fde047' : '#7f1d1d';
        sCtx.font = 'bold 14px sans-serif';
        sCtx.fillText(`X${item.odds}`, bx + betW / 2, betY + 52);
      });
    }

    buildStaticBoardCache();

    // 快速更新螢幕動態部分 (分數、單格亮燈、押注數字)
    function drawScreen(onlyLightChange = false) {
      // 直接複製離屏底圖（單一 GPU blit，極快）
      ctx.drawImage(staticBoardCanvas, 0, 0);

      // 1. WINNER 數字
      ctx.fillStyle = '#180404';
      ctx.fillRect(128, 45, 180, 32);
      ctx.fillStyle = '#ff2a2a';
      ctx.font = 'bold 29px "Courier New", monospace';
      ctx.textAlign = 'right';
      ctx.textBaseline = 'alphabetic';
      ctx.fillText(String(gameState.winner), 296, 70);

      // 2. CREDIT 數字
      ctx.fillStyle = '#180404';
      ctx.fillRect(442, 45, 180, 32);
      ctx.fillStyle = '#ff2a2a';
      ctx.fillText(String(gameState.credit), 611, 70);

      // 3. 中央紅框數字
      const innerX = BOARD_X + CELL_W;
      const innerY = BOARD_Y + CELL_H;
      ctx.fillStyle = '#dc2626';
      ctx.fillRect(innerX + 217, innerY + 274, 66, 39);
      ctx.strokeStyle = '#fde047';
      ctx.lineWidth = 2.5;
      ctx.strokeRect(innerX + 217, innerY + 274, 66, 39);
      ctx.fillStyle = '#fde047';
      ctx.font = 'bold 25px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(String(gameState.centerDisplay), innerX + 250, innerY + 302);

      // 4. 僅重繪目前亮起的那一格跑馬燈
      drawSingleCell(ctx, gameState.activeCell, true);

      // 5. 底部 8 格押注分數
      const betY = 698;
      const betW = BOARD_W / 8;
      betChannels.forEach((item, idx) => {
        const bx = BOARD_X + idx * betW;
        const betVal = gameState.bets[idx];
        ctx.fillStyle = betVal > 0 ? '#7f1d1d' : '#450a0a';
        ctx.fillRect(bx + 3, betY + 69, betW - 6, 71);
        ctx.strokeStyle = betVal > 0 ? '#fde047' : '#f87171';
        ctx.lineWidth = betVal > 0 ? 3 : 2;
        ctx.strokeRect(bx + 3, betY + 69, betW - 6, 71);

        ctx.fillStyle = betVal > 0 ? '#fef08a' : '#ffffff';
        ctx.font = 'bold 34px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(String(betVal), bx + betW / 2, betY + 106);
      });

      screenTexture.needsUpdate = true;
    }

    drawScreen();

    // =========================================================================
    // 3. 木紋與金屬材質及 3D 模型建構
    // =========================================================================
    function createWoodTexture(baseColor, grainColor) {
      const c = document.createElement('canvas');
      c.width = 256;
      c.height = 256;
      const g = c.getContext('2d');
      g.fillStyle = baseColor;
      g.fillRect(0, 0, 256, 256);
      g.fillStyle = grainColor;
      for (let i = 0; i < 120; i++) {
        const y = Math.random() * 256;
        const h = 1 + Math.random() * 2;
        g.globalAlpha = 0.08 + Math.random() * 0.16;
        g.fillRect(0, y, 256, h);
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // 操作面板（與上方螢幕垂直對齊）

    const botLabels = ['BAR', '77', '雙星', '西瓜', '雙鈴', '檸檬', '橘子', '蘋果'];
    pCtx.fillStyle = '#e2e8f0';
    pCtx.font = 'bold 16px "Noto Sans TC", sans-serif';
    botLabels.forEach((txt, i) => {
      const lx = (768 / 8) * (i + 0.5);
      pCtx.fillText(txt, lx, 294);
    });

    const padTex = new THREE.CanvasTexture(padCanvas);
    padTex.colorSpace = THREE.SRGBColorSpace;
    const controlBoard = new THREE.Mesh(
      new THREE.BoxGeometry(1.445, 0.02, 0.56),
      new THREE.MeshStandardMaterial({ map: padTex, roughness: 0.38 })
    );
    panelGroup.add(controlBoard);

    const interactiveButtons = [];
    const keyBaseMat = new THREE.MeshStandardMaterial({ color: 0x1f2937, roughness: 0.6 });
    const whiteKeyMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.25 });
    const redRoundKeyMat = new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.3 });

    function createSquareButton(x, z, actionData) {
      const socket = new THREE.Mesh(new THREE.BoxGeometry(0.112, 0.025, 0.112), keyBaseMat);
      socket.position.set(x, 0.02, z);
      panelGroup.add(socket);

      const cap = new THREE.Mesh(new RoundedBoxGeometry(0.094, 0.048, 0.094, 2, 0.012), whiteKeyMat);
      cap.position.set(x, 0.046, z);
      cap.castShadow = true;
      cap.userData = { ...actionData, restY: 0.046 };
      panelGroup.add(cap);
      interactiveButtons.push(cap);
    }

    [
      { action: 'take_score', label: '得分/移分' },
      { action: 'bet_small',  label: '比倍小 (1-6)' },
      { action: 'bet_big',    label: '比倍大 (8-13)' }
    ].forEach((act, i) => createSquareButton(-0.585 + i * 0.205, -0.14, act));

    [
      { action: 'bet_all', label: '全押/續押' },
      { action: 'clear',   label: '清除押注' },
      { action: 'start',   label: '啟動開始' }
    ].forEach((act, i) => createSquareButton(0.06 + i * 0.205, -0.14, act));

    const ejectSocket = new THREE.Mesh(new THREE.CylinderGeometry(0.040, 0.043, 0.025, 20), keyBaseMat);
    ejectSocket.position.set(0.635, 0.02, -0.14);
    panelGroup.add(ejectSocket);

    const ejectCap = new THREE.Mesh(new THREE.CylinderGeometry(0.030, 0.030, 0.045, 20), redRoundKeyMat);
    ejectCap.position.set(0.635, 0.045, -0.14);
    ejectCap.castShadow = true;
    ejectCap.userData = { action: 'payout', label: '退幣鈕', restY: 0.045 };
    panelGroup.add(ejectCap);
    interactiveButtons.push(ejectCap);

    const screenInnerBoardW = 1.36 * ((768 - 54) / 768);
    const colStep = screenInnerBoardW / 8;
    for (let col = 0; col < 8; col++) {
      const kx = (col - 3.5) * colStep;
      createSquareButton(kx, 0.12, { action: 'bet_item', index: col, label: betChannels[col].icon });
    }

    const trayGroup = new THREE.Group();
    trayGroup.position.set(0, 0.46, 1.00);
    arcadeGroup.add(trayGroup);

    const trayBackplate = new THREE.Mesh(new RoundedBoxGeometry(1.16, 0.44, 0.03, 4, 0.04), brushedMetalMat);
    const trayHole = new THREE.Mesh(new THREE.BoxGeometry(0.96, 0.28, 0.04), darkCavityMat);
    trayHole.position.set(0, 0.01, 0.005);
    const scoopBottom = new THREE.Mesh(new RoundedBoxGeometry(1.04, 0.03, 0.24, 3, 0.01), brushedMetalMat);
    scoopBottom.position.set(0, -0.14, 0.11);
    const scoopFront = new THREE.Mesh(new RoundedBoxGeometry(1.04, 0.15, 0.03, 3, 0.01), brushedMetalMat);
    scoopFront.position.set(0, -0.075, 0.22);
    const scoopLeft = new THREE.Mesh(new RoundedBoxGeometry(0.03, 0.15, 0.24, 3, 0.01), brushedMetalMat);
    scoopLeft.position.set(-0.505, -0.075, 0.11);
    const scoopRight = new THREE.Mesh(new RoundedBoxGeometry(0.03, 0.15, 0.24, 3, 0.01), brushedMetalMat);
    scoopRight.position.set(0.505, -0.075, 0.11);
    trayGroup.add(trayBackplate, trayHole, scoopBottom, scoopFront, scoopLeft, scoopRight);

    const coinsPool = [];
    const coinGeo = new THREE.CylinderGeometry(0.042, 0.042, 0.008, 16);
    const goldMat = new THREE.MeshStandardMaterial({ color: 0xfbbf24, metalness: 0.85, roughness: 0.2 });
    function spawnPayoutCoin() {
      audio.playPayoutCoin();
      const coin = new THREE.Mesh(coinGeo, goldMat);
      coin.position.set((Math.random() - 0.5) * 0.65, -0.118, 0.08 + Math.random() * 0.08);
      coin.rotation.y = Math.random() * Math.PI;
      trayGroup.add(coin);
      coinsPool.push(coin);
      if (coinsPool.length > 25) {
        const old = coinsPool.shift();
        trayGroup.remove(old);
      }
    }

    const lockBarrel = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.04, 16), chromeMat);
    lockBarrel.rotation.z = Math.PI / 2;
    lockBarrel.position.set(1.11, baseHeight + 0.18, 0.1);
    const padlockBody = new THREE.Mesh(
      new RoundedBoxGeometry(0.04, 0.12, 0.08, 2, 0.008),
      new THREE.MeshStandardMaterial({ color: 0xd97706, metalness: 0.8, roughness: 0.3 })
    );
    padlockBody.position.set(1.13, baseHeight + 0.08, 0.1);
    arcadeGroup.add(lockBarrel, padlockBody);

    const footGeo = new THREE.CylinderGeometry(0.08, 0.09, 0.03, 16);
    const footMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.9 });
    [[-0.85, -0.55], [0.85, -0.55], [-0.85, 0.78], [0.85, 0.78]].forEach(([fx, fz]) => {
      const foot = new THREE.Mesh(footGeo, footMat);
      foot.position.set(fx, 0.015, fz);
      arcadeGroup.add(foot);
    });

    // =========================================================================
    // 4. 遊戲互動與高流暢度主迴圈驅動跑燈邏輯
    // =========================================================================
    function autoTakeScoreIfNeeded() {
      if (gameState.winner > 0) {
        gameState.credit += gameState.winner;
        gameState.winner = 0;
      }
    }

    function handleMachineAction(data) {
      audio.unlockAndStartBgm();
      if (gameState.isSpinning) return;

      switch (data.action) {
        case 'insert_coin':
          audio.playCoin();
          gameState.credit += 10;
          setStatus('🪙 投入代幣：可用分數 +10 分！');
          break;

        case 'bet_item': {
          autoTakeScoreIfNeeded();
          const idx = data.index;
          if (gameState.credit <= 0) {
            audio.playLose();
            setStatus('⚠️ 分數不足！請點擊右上角投幣器或面板「投幣」按鈕。');
            break;
          }
          if (gameState.bets[idx] < 99) {
            audio.playBet(idx);
            gameState.credit -= 1;
            gameState.bets[idx] += 1;
            setStatus(`押注【${betChannels[idx].icon}】目前 ${gameState.bets[idx]} 分 (賠率 ${betChannels[idx].odds} 倍)`);
          }
          break;
        }

        case 'bet_all': {
          autoTakeScoreIfNeeded();
          const currentTotal = gameState.bets.reduce((a, b) => a + b, 0);
          const lastTotal = gameState.lastBets.reduce((a, b) => a + b, 0);
          if (currentTotal === 0 && lastTotal > 0 && gameState.credit >= lastTotal) {
            audio.playButton();
            gameState.bets = [...gameState.lastBets];
            gameState.credit -= lastTotal;
            setStatus(`🔁 已續押上一局配置（共 ${lastTotal} 分）`);
          } else {
            let added = 0;
            for (let i = 0; i < 8; i++) {
              if (gameState.credit > 0 && gameState.bets[i] < 99) {
                gameState.credit -= 1;
                gameState.bets[i] += 1;
                added++;
              }
            }
            if (added > 0) {
              audio.playButton();
              setStatus('🔥 全押 +1 分！');
            } else {
              audio.playLose();
              setStatus('⚠️ 分數不足無法全押');
            }
          }
          break;
        }

        case 'clear': {
          const refund = gameState.bets.reduce((a, b) => a + b, 0);
          if (refund > 0) {
            audio.playButton();
            gameState.credit += refund;
            gameState.bets = [0, 0, 0, 0, 0, 0, 0, 0];
            setStatus(`🧹 已清除押注，退回 ${refund} 分至可用分數`);
          }
          break;
        }

        case 'take_score': {
          if (gameState.winner > 0) {
            audio.playTakeScore();
            const gain = gameState.winner;
            gameState.credit += gain;
            gameState.winner = 0;
            setStatus(`💰 得分移分成功！+${gain} 分已轉入 CREDIT`);
          } else {
            audio.playButton();
            setStatus('ℹ️ 目前得分欄為 0，無須移分');
          }
          break;
        }

        case 'bet_small':
        case 'bet_big': {
          if (gameState.winner <= 0) {
            audio.playLose();
            setStatus('⚠️ 中獎得分後才可按「比倍小 / 比倍大」翻倍！');
            break;
          }
          const pool = [1, 2, 3, 4, 5, 6, 8, 9, 10, 11, 12, 13];
          const roll = pool[Math.floor(Math.random() * pool.length)];
          gameState.centerDisplay = roll;
          const isWin = (data.action === 'bet_small' && roll <= 6) || (data.action === 'bet_big' && roll >= 8);
          if (isWin) {
            audio.playWin(false);
            gameState.winner *= 2;
            setStatus(`🎉 開出 ${roll} 點！比倍猜中，獎金翻倍為 ${gameState.winner} 分！`);
          } else {
            audio.playLose();
            gameState.winner = 0;
            setStatus(`💥 開出 ${roll} 點！比倍猜錯，本局獎金歸零`);
          }
          break;
        }

        case 'start': {
          autoTakeScoreIfNeeded();
          const totalBet = gameState.bets.reduce((a, b) => a + b, 0);
          if (totalBet === 0) {
            const lastTotal = gameState.lastBets.reduce((a, b) => a + b, 0);
            if (lastTotal > 0 && gameState.credit >= lastTotal) {
              gameState.bets = [...gameState.lastBets];
              gameState.credit -= lastTotal;
            } else {
              audio.playLose();
              setStatus('⚠️ 請先按下排 8 顆白色按鍵進行押注，再按「啟動」！');
              break;
            }
          }
          audio.playButton();
          gameState.lastBets = [...gameState.bets];
          startMarqueeSpin();
          break;
        }

        case 'payout': {
          autoTakeScoreIfNeeded();
          if (gameState.credit > 0) {
            const coinsToDrop = Math.min(gameState.credit, 10);
            gameState.credit -= coinsToDrop;
            for (let i = 0; i < coinsToDrop; i++) {
              setTimeout(() => spawnPayoutCoin(), i * 95);
            }
            setStatus(`🪙 退幣 ${coinsToDrop} 枚代幣至下方退幣槽！`);
          } else {
            audio.playLose();
            setStatus('ℹ️ 目前可用分數為 0，無代幣可退');
          }
          break;
        }
      }

      drawScreen();
    }

    function startMarqueeSpin() {
      const targetIndex = Math.floor(Math.random() * 24);
      const extraRounds = 24 * 2;
      const stepsNeeded = extraRounds + ((targetIndex - gameState.activeCell + 24) % 24);
      gameState.isSpinning = true;
      gameState.spinTotalSteps = stepsNeeded;
      gameState.spinStepsRemaining = stepsNeeded;
      gameState.spinAccumulator = 0;
      setStatus('🎰 跑馬燈轉動中...');
    }

    function finishMarqueeSpin() {
      gameState.isSpinning = false;
      const landed = boardCells[gameState.activeCell];
      if (landed.type === 'once') {
        audio.playOnceMore();
        setStatus('✨ 命中 ONCE MORE！免費再轉一次！');
        setTimeout(() => startMarqueeSpin(), 550);
        return;
      }

      const betIdx = betChannels.findIndex(c => c.id === landed.type);
      const userBet = betIdx >= 0 ? gameState.bets[betIdx] : 0;
      if (userBet > 0) {
        const prize = userBet * landed.mult;
        gameState.winner = prize;
        const isBig = (landed.type === 'bar' || landed.type === '77' || landed.mult >= 30);
        audio.playWin(isBig);
        setStatus(`🎊 中獎【${landed.label}】獲得 ${prize} 分！可按「比倍」或「得分移分」`);
      } else {
        audio.playLose();
        setStatus(`開出【${landed.label}】，未押中。請重新押注或按「全押/續押」`);
      }
      gameState.bets = [0, 0, 0, 0, 0, 0, 0, 0];
      drawScreen();
    }

    // 3D 點擊偵測
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let pointerDownPos = { x: 0, y: 0 };

    renderer.domElement.addEventListener('pointerdown', (e) => {
      audio.unlockAndStartBgm();
      pointerDownPos = { x: e.clientX, y: e.clientY };
    });

    renderer.domElement.addEventListener('pointerup', (e) => {
      const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
      if (dist > 6) return;

      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(pointer, camera);
      const clickTargets = [...interactiveButtons, coinPlate];
      const intersects = raycaster.intersectObjects(clickTargets, false);

      if (intersects.length > 0) {
        const hit = intersects[0].object;
        if (hit.userData && hit.userData.restY !== undefined) {
          hit.position.y = hit.userData.restY - 0.022;
          setTimeout(() => {
            hit.position.y = hit.userData.restY;
          }, 120);
        }
        handleMachineAction(hit.userData);
      }
    });

    // UI 控制面板事件
    const panel = document.getElementById('controlPanel');
    const panelHeader = document.getElementById('panelHeader');
    const toggleBtn = document.getElementById('toggleBtn');
    panelHeader.addEventListener('click', () => {
      panel.classList.toggle('collapsed');
      toggleBtn.textContent = panel.classList.contains('collapsed') ? '▸' : '▾';
    });

    const themeMap = { white: whiteCabinetMat, darkwood: darkWoodMat, lightwood: lightWoodMat };
    document.querySelectorAll('.style-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const mat = themeMap[btn.dataset.theme];
        cabinetMeshes.forEach(m => { m.material = mat; });
      });
    });

    const toggleBgmBtn = document.getElementById('toggleBgmBtn');
    toggleBgmBtn.addEventListener('click', () => {
      const nextState = !audio.bgmEnabled;
      audio.setBgmEnabled(nextState);
      if (nextState) {
        toggleBgmBtn.textContent = '🎵 BGM：開啟';
        toggleBgmBtn.classList.add('btn-active-green');
        toggleBgmBtn.classList.remove('btn-secondary');
      } else {
        toggleBgmBtn.textContent = '🎵 BGM：靜音';
        toggleBgmBtn.classList.remove('btn-active-green');
        toggleBgmBtn.classList.add('btn-secondary');
      }
    });

    const toggleSfxBtn = document.getElementById('toggleSfxBtn');
    toggleSfxBtn.addEventListener('click', () => {
      audio.sfxEnabled = !audio.sfxEnabled;
      if (audio.sfxEnabled) {
        audio.playButton();
        toggleSfxBtn.textContent = '🔊 音效：開啟';
        toggleSfxBtn.classList.add('btn-active-green');
        toggleSfxBtn.classList.remove('btn-secondary');
      } else {
        toggleSfxBtn.textContent = '🔇 音效：靜音';
        toggleSfxBtn.classList.remove('btn-active-green');
        toggleSfxBtn.classList.add('btn-secondary');
      }
    });

    document.getElementById('insertCoinBtn').addEventListener('click', () => {
      handleMachineAction({ action: 'insert_coin' });
    });

    document.getElementById('focusKeysBtn').addEventListener('click', () => {
      camera.position.set(screenCenterX, 2.35, 2.45);
      controls.target.set(screenCenterX, 1.35, 0.45);
      controls.update();
    });

    document.getElementById('resetCamBtn').addEventListener('click', () => {
      camera.position.set(0.35, 2.55, 5.1);
      controls.target.set(0, 1.48, 0.15);
      controls.update();
    });

    document.getElementById('exportGlbBtn').addEventListener('click', () => {
      const exporter = new GLTFExporter();
      exporter.parse(
        arcadeGroup,
        (result) => {
          const blob = new Blob([result], { type: 'application/octet-stream' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'little_mary_arcade.glb';
          a.click();
          URL.revokeObjectURL(url);
        },
        (error) => console.error('GLB 匯出錯誤:', error),
        { binary: true }
      );
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 主渲染迴圈 (以時間差精準推進跑燈，完全不卡頓)
    let lastTime = performance.now();
    function animate(now) {
      requestAnimationFrame(animate);
      const dt = Math.min(now - lastTime, 100);
      lastTime = now;

      if (gameState.isSpinning) {
        gameState.spinAccumulator += dt;
        const rem = gameState.spinStepsRemaining;
        // 尾聲 12 格平滑減速曲線
        const stepInterval = rem > 12 ? 42 : 42 + (13 - rem) * 28;

        if (gameState.spinAccumulator >= stepInterval) {
          gameState.spinAccumulator = 0;
          gameState.activeCell = (gameState.activeCell + 1) % 24;
          const stepIdx = gameState.spinTotalSteps - rem;
          audio.playStep(stepIdx);
          drawScreen(true);
          gameState.spinStepsRemaining--;

          if (gameState.spinStepsRemaining <= 0) {
            finishMarqueeSpin();
          }
        }
      }

      controls.update();
      renderer.render(scene, camera);
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
